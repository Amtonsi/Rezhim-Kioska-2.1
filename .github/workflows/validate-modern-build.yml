name: Validate Modern build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-modern-x86:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.8 x86
        uses: actions/setup-python@v6
        with:
          python-version: "3.8"
          architecture: x86
          cache: pip
          cache-dependency-path: requirements-modern-build.txt

      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-modern-build.txt

      - name: Run complete V2 test suite
        run: python -m unittest discover -s v2\tests -p "test_*.py"

      - name: Build all Modern executables
        shell: powershell
        run: |
          $python = (Get-Command python).Source
          .\v2\scripts\build-modern.ps1 -Python $python

      - name: Verify portable Modern bundle
        shell: powershell
        run: |
          $required = @(
            "v2\dist\modern\RezhimKioska-V2-Modern.exe",
            "v2\dist\modern\Restore-V2-Modern.exe",
            "v2\dist\modern\Configurator-V2-Modern.exe",
            "v2\dist\modern\Restore.exe",
            "v2\dist\modern\Configurator.exe",
            "v2\dist\modern\config\kiosk.v2.json",
            "v2\dist\SHA256SUMS.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required build artifact is missing: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Build artifact is empty: $path"
            }
          }
          $hashLines = Get-Content -LiteralPath "v2\dist\SHA256SUMS.txt"
          if (($hashLines | Where-Object { $_ -match "modern/.+\.exe" }).Count -ne 3) {
            throw "SHA256SUMS.txt must contain all three named Modern executables."
          }
