name: Validate Windows builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern:
    name: ${{ matrix.target }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: compat-x86
            python: "3.8.10"
            arch: x86
            dist: modern
          - target: current-x64
            python: "3.14.10"
            arch: x64
            dist: modern-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - run: python -m pip install -r v2/requirements-modern.txt
      - run: python -m unittest discover -s v2/tests -p "test_*.py"
      - name: Build the portable folder
        shell: powershell
        run: .\v2\scripts\build-modern.ps1 -Target ${{ matrix.target }} -Python (Get-Command python).Source
      - name: Verify both launcher checks, helpers and first-run config
        shell: pwsh
        run: |
          $dir = "v2/dist/${{ matrix.dist }}"
          $exe = Join-Path $dir "RezhimKioska-V2-Modern.exe"
          foreach ($flag in @("--platform-check", "--check-config")) {
            $p = Start-Process -FilePath $exe -ArgumentList $flag -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$flag exited $($p.ExitCode)" }
          }
          foreach ($tool in @("Restore", "Configurator")) {
            $aliasHash = (Get-FileHash "$dir/$tool.exe").Hash
            if ($aliasHash -ne (Get-FileHash "$dir/$tool-V2-Modern.exe").Hash) { throw "$tool alias mismatch" }
          }
          if ((Get-FileHash "$dir/config/kiosk.v2.json").Hash -ne (Get-FileHash "config/kiosk.v2.default.json").Hash) { throw "Release config mismatch" }
