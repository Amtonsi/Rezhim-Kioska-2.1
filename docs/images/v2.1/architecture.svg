<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="398" viewBox="0 0 1080 398" role="img" aria-labelledby="title desc">
  <title id="title">Компоненты киоска и права пользователей</title>
  <desc id="desc">Windows запускает Launcher в сеансе оператора. Launcher проверяет SID, управляет рабочим столом и контролирует приложение. Конфигуратор изменяет настройки, а Restore устанавливает и восстанавливает оболочку профиля.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0 L8 4 L0 8z" fill="#51b9dc"/></marker>
  </defs>
  <rect width="1080" height="398" rx="12" fill="#122136"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g fill="#9ed6ef" font-size="18" font-weight="600">
      <text x="34" y="47">Сеанс оператора</text>
      <text x="34" y="230">Действия администратора</text>
    </g>
    <g stroke="#49738b" fill="#1c3047">
      <rect x="34" y="68" width="282" height="99" rx="7"/>
      <rect x="396" y="68" width="286" height="99" rx="7"/>
      <rect x="762" y="68" width="284" height="99" rx="7"/>
      <rect x="34" y="254" width="285" height="97" rx="7"/>
      <rect x="396" y="254" width="286" height="97" rx="7"/>
      <rect x="762" y="254" width="284" height="97" rx="7"/>
    </g>
    <g stroke="#51b9dc" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M317 118h68"/><path d="M684 118h68"/>
      <path d="M320 303h65"/>
      <path d="M539 254v-76"/>
      <path d="M904 351v22H18V118h11"/>
    </g>
    <g fill="#f6f9fc" font-size="25" font-weight="600">
      <text x="54" y="110">Вход в Windows</text>
      <text x="417" y="110">Launcher</text>
      <text x="783" y="110">Приложение</text>
      <text x="54" y="297">Configurator.exe</text>
      <text x="417" y="297">Файл конфигурации</text>
      <text x="783" y="297">Restore.exe</text>
    </g>
    <g fill="#cadbe8" font-size="16">
      <text x="54" y="140">Обычная локальная учётная запись</text>
      <text x="417" y="140">Проверка SID и изоляция сеанса</text>
      <text x="783" y="140">Запуск, окно и перезапуск</text>
      <text x="54" y="327">Выбор разрешённого EXE</text>
      <text x="417" y="327">config/kiosk.v2.json</text>
      <text x="783" y="327">Установка и откат оболочки</text>
    </g>
  </g>
</svg>
